services:
    www:
        build: .
        environment:
            ARGFRAME_DB_HOST: db
            ARGFRAME_DB_USER: admin
            ARGFRAME_DB_PASSWORD: ${ARGFRAME_DB_PASSWORD:-admin}
            ARGFRAME_DB_NAME: arg-db
        ports: 
            - "127.0.0.1:8001:80"
        volumes:
            - ./www:/var/www/html/
        links:
            - db
        networks:
            - default
    db:
        image: mysql:8.0
        ports: 
            - "127.0.0.1:3306:3306"
        command: --default-authentication-plugin=mysql_native_password
        environment:
            MYSQL_DATABASE: arg-db
            MYSQL_USER: admin
            MYSQL_PASSWORD: ${ARGFRAME_DB_PASSWORD:-admin}
            MYSQL_ROOT_PASSWORD: ${ARGFRAME_DB_ROOT_PASSWORD:-admin} 
        volumes:
            - ./dump:/docker-entrypoint-initdb.d
            - ./conf:/etc/mysql/conf.d
            - persistent:/var/lib/mysql
        networks:
            - default
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        links: 
            - db:db
        ports:
            - "127.0.0.1:8000:80"
        environment:
            MYSQL_USER: admin
            MYSQL_PASSWORD: ${ARGFRAME_DB_PASSWORD:-admin}
            MYSQL_ROOT_PASSWORD: ${ARGFRAME_DB_ROOT_PASSWORD:-admin} 
volumes:
    persistent:
